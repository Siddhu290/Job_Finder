<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume PDF · Apply Seamlessly</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<style>
  :root { color-scheme: light dark; --bg:#f7f7f9; --fg:#1d1d24; --muted:#6b6b78; --accent:#4f46e5; --bad:#b42318; --border:#dcdce4 }
  @media (prefers-color-scheme: dark) { :root { --bg:#15151b; --fg:#ececf1; --muted:#a0a0ad; --accent:#8b85ff; --bad:#ff8a80; --border:#33333d } }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg) }
  main { max-width:1000px; margin:0 auto; padding:16px }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center }
  a.btn, button.btn { display:inline-block; border:0; cursor:pointer; font:inherit; padding:8px 14px; border-radius:8px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600 }
  #status { color:var(--muted) } #status.bad { color:var(--bad) }
  progress { width:min(420px, 100%) }
  iframe { width:100%; height:80vh; border:1px solid var(--border); border-radius:8px; margin-top:12px; background:#fff }
  pre { white-space:pre-wrap; font-size:12px; max-height:40vh; overflow:auto; border:1px solid var(--border); padding:8px; border-radius:8px }
</style>
</head>
<body>
<main>
  <h1 style="font-size:20px;margin:0 0 4px">Resume PDF</h1>
  <p class="muted" style="margin:0 0 12px;color:var(--muted)">Made on this device with a LaTeX engine running in your browser. Your resume is not uploaded anywhere; only the engine and standard LaTeX files are downloaded (about 45 MB the first time, then cached).</p>
  <p id="status" role="status" aria-live="polite">Waiting for your LaTeX…</p>
  <progress id="bar" hidden></progress>
  <div class="row" id="actions" hidden></div>
  <iframe id="view" title="PDF preview" hidden></iframe>
  <pre id="log" hidden></pre>
</main>
<script type="module" src="pdf.js"></script>
</body>
</html>
