<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresher Data Jobs</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="gate" class="gate" hidden>
  <h1 id="gateTitle">Sign in</h1>
  <p class="sub" id="gateSub"></p>
  <form id="gateForm" novalidate>
    <div id="nameField" hidden><label class="f" for="rname">Full name</label><input id="rname" type="text" autocomplete="name" maxlength="80"></div>
    <div id="emailField" hidden><label class="f" for="email" id="emailLabel">Email</label><input id="email" type="text" autocomplete="username" maxlength="254" autocapitalize="none" spellcheck="false"></div>
    <label class="f" for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div id="pw2Field" hidden><label class="f" for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password"></div>
    <div id="inviteField" hidden><label class="f" for="invite">Invite code</label><input id="invite" type="text" autocomplete="off"></div>
    <div class="err" id="gateErr" role="alert"></div>
    <button class="btn primary" type="submit" id="gateBtn" style="width:100%;justify-content:center">Sign in</button>
  </form>
  <p class="sub" id="gateSwitch" style="text-align:center;margin-top:14px" hidden></p>
</div>
<div id="app" class="layout" hidden>
  <nav class="side" id="nav" aria-label="Sections"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<dialog id="dlg" aria-label="Application details"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js"></script>
</body>
</html>
